<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Campaña | Portafolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" media="all" href="style.css" />
</head>
<body>

    <div class="lines">
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
    </div>

    <main class="wrapper">
        
        <section id="sphere-interface" class="interface-container active-section">
            <div class="spheres-grid">
                
                <div class="sphere-card" data-section="about" style="--accent: #38bdf8;">
                    <div class="sphere"></div>
                    <h3>Sobre Mí</h3>
                </div>

                <div class="sphere-card" data-section="experience" style="--accent: #a78bfa;">
                    <div class="sphere"></div>
                    <h3>Experiencia</h3>
                </div>

                <div class="sphere-card" data-section="studies" style="--accent: #f472b6;">
                    <div class="sphere"></div>
                    <h3>Estudios</h3>
                </div>

                <div class="sphere-card" data-section="projects" style="--accent: #fb923c;">
                    <div class="sphere"></div>
                    <h3>Proyectos</h3>
                </div>

            </div>
        </section>

        <section id="details-content" class="details-container">
            <button class="back-btn">← Volver</button>
            <div id="content-area"></div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
